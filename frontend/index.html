<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Telecom X Pro - AI-Powered Churn Prediction & Customer Analytics</title>
    <meta name="title" content="Telecom X Pro - AI-Powered Churn Prediction & Customer Analytics" />
    <meta name="description" content="Advanced customer churn prediction platform with machine learning, real-time analytics, and seamless Power BI & Tableau integration for telecom businesses." />
    <meta name="keywords" content="churn prediction, customer analytics, machine learning, telecom analytics, AI, Power BI, Tableau, data science, customer retention" />
    <meta name="author" content="Elizabeth Díaz Familia" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://telecom-x-pro.com/" />
    <meta property="og:title" content="Telecom X Pro - AI-Powered Churn Prediction" />
    <meta property="og:description" content="Advanced customer churn prediction platform with machine learning and real-time analytics." />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://telecom-x-pro.com/" />
    <meta property="twitter:title" content="Telecom X Pro - AI-Powered Churn Prediction" />
    <meta property="twitter:description" content="Advanced customer churn prediction platform with machine learning and real-time analytics." />
    <meta property="twitter:image" content="/twitter-image.png" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#667eea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telecom X Pro" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/src/main.tsx" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    
    <!-- No-index for development -->
    <!-- <meta name="robots" content="noindex, nofollow" /> -->
  </head>
  <body>
    <!-- Main App Container -->
    <div id="root"></div>
    
    <!-- Loading Screen -->
    <noscript>
      <div style="
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
        padding: 2rem;
      ">
        <div>
          <h1 style="font-size: 2rem; margin-bottom: 1rem;">⚠️ JavaScript Required</h1>
          <p style="font-size: 1.125rem; opacity: 0.9;">
            Please enable JavaScript in your browser to use Telecom X Pro.
          </p>
          <p style="margin-top: 1rem; opacity: 0.7;">
            This application requires JavaScript to provide you with the best experience.
          </p>
        </div>
      </div>
    </noscript>
    
    <!-- React App Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration (PWA) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
