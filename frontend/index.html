    <!-- FIX-01 REMOVED: <link rel="modulepreload" href="/src/main.tsx" />
         This line pointed to a TypeScript source file that does NOT exist in production.
         In production Vite compiles main.tsx into /assets/index-[hash].js.
         The modulepreload caused a 404 error in the browser console on every page load.
         Vite automatically injects the correct modulepreload tags during build. -->

    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    
    <!-- No-index for development -->
    <!-- <meta name="robots" content="noindex, nofollow" /> -->

    <!-- FIX-02: GitHub Pages SPA Router restore script.
         Works together with 404.html. When GitHub Pages serves 404.html for a
         deep route (e.g. /dashboard), that page stores the path in sessionStorage
         and redirects to /. This script runs BEFORE React loads and silently
         restores the original URL so React Router renders the right page.
         Without this, every direct URL or page refresh on a sub-route shows a real 404. -->
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>

    <div id="root"></div>
    
    <!-- Loading Screen -->
    <noscript>
      <div style="
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
        padding: 2rem;
      ">

          <h1 style="font-size: 2rem; margin-bottom: 1rem;">⚠️ JavaScript Required</h1>
          <p style="font-size: 1.125rem; opacity: 0.9;">
            Please enable JavaScript in your browser to use Telecom X Pro.

          <p style="margin-top: 1rem; opacity: 0.7;">
            This application requires JavaScript to provide you with the best experience.
          </p>
        </div>
      </div>
    </noscript>
    
    <!-- React App Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration (PWA) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          // FIX-03: Use a relative URL instead of the hardcoded '/sw.js'.
          // '/sw.js' resolves to the domain root, which on GitHub Pages is
          // lizzy0981.github.io/sw.js — that file does not exist there.
          // new URL('./sw.js', window.location.href) correctly resolves to
          // lizzy0981.github.io/telecom-x-churn-analysis/sw.js in every environment.
          var swUrl = new URL('./sw.js', window.location.href).href;
          navigator.serviceWorker.register(swUrl)
            .then(function(registration) {
              console.log('SW registered:', registration);
            })
            .catch(function(error) {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
